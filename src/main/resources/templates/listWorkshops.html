<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <title>Workshop Registration - Choose a Workshop</title>
    <style type="text/css">
        body {
            width: 800px;
            margin: 40px auto;
            font-family: Arial, sans-serif;
        }
        h1 {
            color: #333;
            margin-bottom: 10px;
        }
        h2 {
            margin-bottom: 10px;
        }
        main {
            padding: 20px;
        }
        form {
            margin-top: 20px;
            margin-bottom: 20px;
        }
        label {
            margin-right: 5px;
        }
        table {
            width: 100%;
            margin-top: 25px;
            margin-bottom: 35px;
            border-collapse: collapse;
        }
        table, th, td {
            border: 1px solid #ddd;
        }
        .workshop-option {
            margin: 10px 0;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 5px;
        }
        .workshop-option:hover {
            background-color: #f5f5f5;
        }
        input[type="text"],
        input[type="number"],
        input[type="email"] {
            padding: 6px 10px;
            margin-right: 10px;
            margin-bottom: 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
        }
        button,
        input[type="submit"] {
            padding: 8px 16px;
            border: 1px solid black;
            border-radius: 4px;
        }
        .error {
            color: red;
        }
    </style>
</head>
<body>
<header>
    <h1>Welcome to our Workshop Registration App</h1>
</header>
<main>
    <!-- Display the errorMessage here (only if it exists), using the "error" class -->
    <div th:if="${errorMessage}" class="error">
        <p th:text="${errorMessage}"></p>
    </div>

    <form action="/workshops" method="GET">
        <h2>Search workshops:</h2>
        <label>Title or category contains:</label>
        <input type="text" name="text">
        <label>Max price:</label>
        <input type="number" name="maxPrice" min="0" step="0.01">
        <input type="submit" value="Search">
    </form>

    <h2>Manage workshops</h2>

    <a href="/workshops/workshop-form">Add new workshop</a>

    <table>
        <thead>
        <tr>
            <th>Title</th>
            <th>Category</th>
            <th>Price</th>
            <th>Free seats</th>
            <th>Instructor</th>
            <th>Rating Average</th>
            <th>Add Rating</th>
            <th>Actions</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="workshop : ${workshops}">
            <td th:text="${workshop.title}"></td>
            <td th:text="${workshop.category}"></td>
            <td th:text="${workshop.price}"></td>
            <td th:text="${workshop.capacity}"></td>
            <td th:text="${workshop.instructor.name + ' ' + workshop.instructor.surname}"></td>
            <td th:text="${workshop.getAvgRating() != null ? #numbers.formatDecimal(workshop.getAvgRating(), 1, 2) : 'No ratings yet'}"></td>
            <td>
                <form th:action="@{/workshops/rate/{id}(id=${workshop.id})}" method="post">
                    <input type="number" name="rating" min="1" max="5" step="0.5" required>
                    <button type="submit">Add Rating</button>
                </form>
            </td>
            <td>
                <a th:href="@{/workshops/workshop-form/{id}(id=${workshop.id})}">Edit</a>

                <form th:action="@{/workshops/delete/{id}(id=${workshop.id})}" method="post">
                    <button type="submit">Delete</button>
                </form>
            </td>
        </tr>
        </tbody>
    </table>

    <form action="/registration" method="POST">
        <h2>Choose a workshop:</h2>
        <!-- Display a radio button for each workshop,
             the value should be the workshop title
             and the displayed text should be:
             Title: <title>, Category: <category>, Price: <price> MKD, Free seats: <capacity>
             Workshops with 0 free seats are shown, but their radio button is disabled -->
        <div class="workshop-option" th:each="workshop : ${workshops}">
            <input type="radio" name="workshopTitle" th:value="${workshop.title}" th:disabled="${workshop.capacity == 0}" required>
            <span th:text="
                    'Title: ' + ${workshop.title} + ', Category: ' + ${workshop.category} +
                    ', Price: ' + ${workshop.price} + ' MKD, Free seats: ' + ${workshop.capacity} +
                    ', Instructor: ' + ${workshop.instructor.name + ' ' + workshop.instructor.surname}">
            </span>
        </div>


        <h2>Enter your information:</h2>
        <label>Your Name:</label>
        <input type="text" name="participantName" required><br/>
        <label>Your Email:</label>
        <input type="email" name="participantEmail" required><br/>

        <h2>Choose number of seats:</h2>
        <input type="number" name="numSeats" min="1" required><br/>
        <br/>
        <input type="submit" value="Register">
    </form>
</main>
</body>
</html>
