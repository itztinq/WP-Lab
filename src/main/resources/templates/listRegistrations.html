<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <title>Workshop Registration - Choose a Workshop</title>
    <style type="text/css">
        body {
            width: 800px;
            margin: 40px auto;
            font-family: Arial, sans-serif;
        }
        h1 {
            color: #333;
            margin-bottom: 10px;
        }
        h2 {
            margin-bottom: 10px;
        }
        main {
            padding: 20px;
        }
        form {
            margin-top: 20px;
            margin-bottom: 20px;
        }
        label {
            margin-right: 5px;
        }
        table {
            width: 100%;
            margin-top: 25px;
            margin-bottom: 35px;
            border-collapse: collapse;
        }
        table, th, td {
            border: 1px solid #ddd;
        }
        input[type="text"],
        input[type="number"],
        input[type="email"] {
            padding: 6px 10px;
            margin-right: 10px;
            margin-bottom: 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
        }
        button,
        input[type="submit"] {
            padding: 8px 16px;
            border: 1px solid black;
            border-radius: 4px;
        }
    </style>
</head>
<body>
<header>
    <h1>All Registrations</h1>
</header>
<main>
    <table>
        <thead>
        <tr>
            <th>Workshop</th>
            <th>Participant Name</th>
            <th>Participant Email</th>
            <th>Number of Seats</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="registration : ${registrations}">
            <td th:text="${registration.workshopTitle}"></td>
            <td th:text="${registration.participantName}"></td>
            <td th:text="${registration.participantEmail}"></td>
            <td th:text="${registration.numberOfSeats}"></td>
        </tr>
        </tbody>
    </table>

    <p><a href="/workshops">Back to workshops</a></p>
</main>
</body>
</html>
